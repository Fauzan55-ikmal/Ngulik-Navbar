<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>GitHub Navbar Clone</title>

    <link rel="stylesheet" href="assets/css/style.css" />
  </head>

  <body>
    <!-- =================================================================== -->
    <!-- MAIN NAVBAR                                                         -->
    <!-- =================================================================== -->
    <header class="gh-header">
      <!-- LEFT SECTION ---------------------------------------------------- -->
      <div class="gh-nav-left">
        <!-- Hamburger Menu Button -->
        <button class="gh-btn-icon" data-tooltip="Open menu">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor">
            <path
              d="M1 2.75A.75.75 0 0 1 1.75 2h12.5a.75.75 0 0 1 0 1.5H1.75A.75.75 0 0 1 1 2.75Zm0 5A.75.75 0 0 1 1.75 7h12.5a.75.75 0 0 1 0 1.5H1.75A.75.75 0 0 1 1 7.75Zm0 5a.75.75 0 0 1 .75-.75h12.5a.75.75 0 0 1 0 1.5H1.75a.75.75 0 0 1-.75-.75Z"
            ></path>
          </svg>
        </button>

        <!-- Octocat Logo + Custom Tooltip -->
        <a href="#" class="gh-logo-link">
          <svg class="gh-logo" viewBox="0 0 16 16" width="32" height="32" fill="currentColor">
            <path
              d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"
            ></path>
          </svg>
          <span class="gh-tooltip"> Homepage <kbd>G</kbd><kbd>D</kbd> </span>
        </a>

        <!-- Dashboard Button -->
        <button class="gh-dashboard-btn">Dashboard</button>
      </div>

      <!-- RIGHT SECTION --------------------------------------------------- -->
      <div class="gh-nav-right">
        <!-- 1. Search Box -->
        <div class="gh-search-wrapper">
          <button class="gh-search-btn">
            <svg height="16" viewBox="0 0 16 16" width="16" fill="currentColor">
              <path d="M10.68 11.74a6 6 0 1 1 1.06-1.06l3.04 3.04a.75.75 0 1 1-1.06 1.06l-3.04-3.04ZM11.5 7a4.5 4.5 0 1 0-9 0 4.5 4.5 0 0 0 9 0Z"></path>
            </svg>
            <span class="gh-search-text">Type <kbd>/</kbd> to search</span>
          </button>
        </div>

        <!-- 2. Copilot Button -->
        <button class="gh-btn-icon" aria-label="Copilot">
          <svg height="16" viewBox="0 0 16 16" width="16" fill="currentColor">
            <path d="M8 0a8 8 0 1 0 8 8 A8 8 0 0 0 8 0Zm0 14.5a6.5 6.5 0 1 1 6.5-6.5 6.51 6.51 0 0 1-6.5 6.5Z"></path>
          </svg>
          <span class="gh-caret">▾</span>
        </button>

        <!-- Vertical Divider -->
        <div class="gh-divider"></div>

        <!-- 3. Create (+) Button -->
        <button class="gh-btn-icon" aria-label="Create new...">
          <svg height="16" viewBox="0 0 16 16" width="16" fill="currentColor">
            <path d="M7.75 2a.75.75 0 0 1 .75.75V7h4.25a.75.75 0 0 1 0 1.5H8.5v4.25a.75.75 0 0 1-1.5 0V8.5H2.75a.75.75 0 0 1 0-1.5H7V2.75A.75.75 0 0 1 7.75 2Z"></path>
          </svg>
          <span class="gh-caret">▾</span>
        </button>

        <!-- 4. Issues Icon -->
        <button class="gh-btn-icon" aria-label="Issues">
          <svg height="16" viewBox="0 0 16 16" width="16" fill="currentColor">
            <path d="M8 9.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Z"></path>
            <path d="M8 0a8 8 0 1 1 0 16A8 8 0 0 1 8 0ZM1.5 8a6.5 6.5 0 1 0 13 0 6.5 6.5 0 0 0-13 0Z"></path>
          </svg>
        </button>

        <!-- 5. Pull Requests Icon -->
        <button class="gh-btn-icon" aria-label="Pull requests">
          <svg height="16" viewBox="0 0 16 16" width="16" fill="currentColor">
            <path
              d="M1.5 3.25a2.25 2.25 0 1 1 3 2.122v5.256a2.251 2.251 0 1 1-1.5 0V5.372A2.25 2.25 0 0 1 1.5 3.25Zm5.677-.177L9.573.677A.25.25 0 0 1 10 .854V2.5h1.25A3.25 3.25 0 0 1 14.5 5.75v5.128a2.251 2.251 0 1 1-1.5 0V5.75A1.75 1.75 0 0 0 11.25 4H10v1.646a.25.25 0 0 1-.427.177L7.177 3.427a.25.25 0 0 1 0-.354Z"
            ></path>
          </svg>
        </button>

        <!-- 6. Bookmark Icon -->
        <button class="gh-btn-icon" aria-label="Bookmark">
          <svg height="16" viewBox="0 0 16 16" width="16" fill="currentColor">
            <path d="M3 2.75C3 1.784 3.784 1 4.75 1h6.5c.966 0 1.75.784 1.75 1.75v11.5a.75.75 0 0 1-1.227.579L8 11.722l-3.773 3.107A.75.75 0 0 1 3 14.25V2.75Z"></path>
          </svg>
        </button>

        <!-- 7. Notifications Icon -->
        <button class="gh-btn-icon" aria-label="Notifications">
          <svg height="16" viewBox="0 0 16 16" width="16" fill="currentColor">
            <path
              d="M1 2.75C1 1.784 1.784 1 2.75 1h10.5c.966 0 1.75.784 1.75 1.75v10.5A1.75 1.75 0 0 1 13.25 15H2.75A1.75 1.75 0 0 1 1 13.25V2.75ZM2.75 2.5a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h2.878c.266 0 .52.105.707.293l1.715 1.715a.25.25 0 0 0 .354 0l1.715-1.715a1 1 0 0 1 .707-.293h2.878a.25.25 0 0 0 .25-.25v-7.5a.25.25 0 0 0-.25-.25H2.75Z"
            ></path>
          </svg>
        </button>

        <!-- 8. Profile Avatar -->
        <a href="#" class="gh-avatar-link">
          <img src="https://github.com/identicons/fauzan.png" alt="Profile" class="gh-avatar" />
        </a>
      </div>
    </header>

    <!-- JS Scripts -->
    <script src="assets/js/script.js"></script>
  </body>
</html>
