<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Navbar Tokopedia - Ngulik Navbar</title>

    <!-- Link ke File CSS Lokal -->
    <link rel="stylesheet" href="assets/css/style.css" />

    <!-- Feather Icons (CDN untuk kebutuhan ikon search & cart) -->
    <script src="https://unpkg.com/feather-icons"></script>
  </head>

  <body>
    <header class="tokopedia-header">
      <nav class="navbar-main">
        <!-- 1. Logo Tokopedia -->
        <a href="#" class="brand-logo" aria-label="Tokopedia">
          <svg width="150" height="34" viewBox="0 0 150 34" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M14.5 5.5C12.0147 5.5 10 7.51472 10 10V12H6V10C6 5.30558 9.80558 1.5 14.5 1.5C19.1944 1.5 23 5.30558 23 10V12H19V10C19 7.51472 16.9853 5.5 14.5 5.5Z" fill="#03AC0E" />
            <path
              fill-rule="evenodd"
              clip-rule="evenodd"
              d="M2 13C2 11.8954 2.89543 11 4 11H25C26.1046 11 27 11.8954 27 13V29C27 30.1046 26.1046 31 25 31H4C2.89543 31 2 30.1046 2 29V13ZM14.5 15C10.3579 15 7 18.3579 7 22.5C7 26.6421 10.3579 30 14.5 30C18.6421 30 22 26.6421 22 22.5C22 18.3579 18.6421 15 14.5 15ZM14.5 19C12.567 19 11 20.567 11 22.5C11 24.433 12.567 26 14.5 26C16.433 26 18 24.433 18 22.5C18 20.567 16.433 19 14.5 19Z"
              fill="#03AC0E"
            />
            <text x="32" y="24" font-family="Arial, sans-serif" font-weight="900" font-size="20" fill="#03AC0E" letter-spacing="-0.5">tokopedia</text>
          </svg>
        </a>

        <!-- 2. Tombol Kategori -->
        <button class="btn-kategori">Kategori</button>

        <!-- 3. Form / Search Bar -->
        <div class="search-container">
          <i data-feather="search" class="icon-search"></i>
          <input type="text" placeholder="Cari di Tokopedia" autocomplete="off" />
        </div>

        <!-- 4. Area Keranjang & Akses Akun -->
        <div class="nav-right">
          <a href="#" class="btn-cart" title="Keranjang">
            <i data-feather="shopping-cart"></i>
          </a>

          <div class="vertical-divider"></div>

          <button class="btn-masuk">Masuk</button>
          <button class="btn-daftar">Daftar</button>
        </div>
      </nav>

      <!-- 5. Baris Bawah: Informasi Lokasi Pengiriman -->
      <div class="navbar-bottom">
        <div class="location-wrapper">
          <i data-feather="map-pin" class="icon-location"></i>
          <span>Dikirim ke <strong>Jakarta Pusat</strong></span>
          <i data-feather="chevron-down" class="icon-chevron"></i>
        </div>
      </div>
    </header>

    <script>
      feather.replace();
    </script>
    <script src="assets/js/script.js" defer></script>
  </body>
</html>
